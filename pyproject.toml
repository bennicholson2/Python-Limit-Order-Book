[tool.poetry]
name = "lob_simulator"
version = "0.1.0"
description = "A production-grade modular Limit Order Book Simulator"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "lob_simulator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
pandas = "^2.0.0"
pyyaml = "^6.0"
simpy = "^4.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
ruff = "^0.1.0"
mypy = "^1.0.0"
types-pyyaml = "^6.0"
ipykernel = "^6.0.0"  # Allows your notebooks to use this environment

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Configure Ruff (Linter & Formatter)
[tool.ruff]
target-version = "py310"
line-length = 88
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Configure Mypy (Strict Type Checking)
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true