[project]
name = "lob_simulator"
version = "0.1.0"
description = "A production-grade modular Limit Order Book Simulator"
authors = [{ name = "Benjamin Nicholson", email = "nicholson.benjamin.t@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",  # For configuration parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

# Configure Ruff (Linter & Formatter)
[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E", "F", "W", # Flake8 core errors/warnings
    "I",           # Isort (import sorting)
    "B",           # Flake8-bugbear (catches design flaws)
    "UP",          # Pyupgrade (ensures modern syntax)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Configure Mypy (Strict Type Checking)
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  # Forces you to write types for functions